<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>SFX audition</title>
  <style>
    body { font: 14px system-ui, sans-serif; background: #1b1712; color: #eadfc8; padding: 24px; }
    button { margin: 4px; padding: 8px 12px; background: #3a3024; color: inherit; border: 1px solid #6b5a42; border-radius: 4px; cursor: pointer; }
    button:hover { background: #4d3f2e; }
    h2 { margin-top: 20px; font-size: 15px; color: #d9a54a; }
  </style>
</head>
<body>
  <h1>Oil for the Overlord · 音效试听</h1>
  <p>Click any button. Sounds are rendered by <code>tools/build-sfx.py</code> into <code>public/audio/sfx</code> and played by <code>src/sfx.js</code>.</p>
  <p id="status">Loading…</p>
  <div id="list"></div>
  <script type="module">
    import * as sfx from '../src/sfx.js';
    const groups = {
      'Board / 棋盘': [['thud (tile lands)', () => sfx.thud()], ['thud heavy (Wasteland piece)', () => sfx.thud(true)]],
    };
    sfx.sfxLoaded().then((ok) => (document.getElementById('status').textContent = ok ? 'Loaded.' : 'FAILED to load (see console).'));
    const list = document.getElementById('list');
    for (const [title, items] of Object.entries(groups)) {
      const h = document.createElement('h2');
      h.textContent = title;
      list.append(h);
      for (const [name, fn] of items) {
        const b = document.createElement('button');
        b.textContent = name;
        b.onclick = async () => { await sfx.whenSfxRunning(); fn(); };
        list.append(b);
      }
    }
  </script>
</body>
</html>
