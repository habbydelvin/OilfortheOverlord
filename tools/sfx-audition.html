<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>SFX audition</title>
  <style>
    body { font: 14px system-ui, sans-serif; background: #1b1712; color: #eadfc8; padding: 24px; }
    button { margin: 4px; padding: 8px 12px; background: #3a3024; color: inherit; border: 1px solid #6b5a42; border-radius: 4px; cursor: pointer; }
    button:hover { background: #4d3f2e; }
    h2 { margin-top: 20px; font-size: 15px; color: #d9a54a; }
  </style>
</head>
<body>
  <h1>Oil for the Overlord · 音效试听</h1>
  <p>Click any button. The landing is a recording rendered by <code>tools/build-sfx.py</code> into <code>public/audio/sfx</code>; the rest are synthesised live in <code>src/sfx.js</code>.</p>
  <p id="status">Loading…</p>
  <div id="list"></div>
  <script type="module">
    import * as sfx from '../src/sfx.js';
    const groups = {
      'Recorded / 录音': [['thud (tile lands)', () => sfx.thud()], ['thud heavy (Wasteland piece)', () => sfx.thud(true)]],
      'Board / 棋盘 (synth)': [['tick up', () => sfx.tick(true)], ['tick down', () => sfx.tick(false)], ['hover', sfx.hover], ['chirp', sfx.chirp], ['deal', sfx.deal], ['shuffle', sfx.shuffle], ['coin', sfx.coin], ['food', sfx.food], ['barrel 0', () => sfx.barrel(0)], ['barrel 1', () => sfx.barrel(1)], ['latch', sfx.latch], ['confirm', sfx.confirm], ['buzz', sfx.buzz], ['deny', sfx.deny], ['demolition', () => sfx.demolition()], ['demolition heavy', () => sfx.demolition(true)], ['doom', sfx.doom]],
      'Dialogue / 对话 (synth)': [['speak', sfx.speak], ['click', sfx.click], ['choiceHover', sfx.choiceHover], ['choiceClick', sfx.choiceClick]],
      'Combat fallback / 战斗 (synth)': [['silo', sfx.silo], ['boom', sfx.boom], ['ciws 0.8s', () => sfx.ciws(0.8)]],
    };
    sfx.sfxLoaded().then((ok) => (document.getElementById('status').textContent = ok ? 'Loaded.' : 'FAILED to load (see console).'));
    const list = document.getElementById('list');
    for (const [title, items] of Object.entries(groups)) {
      const h = document.createElement('h2');
      h.textContent = title;
      list.append(h);
      for (const [name, fn] of items) {
        const b = document.createElement('button');
        b.textContent = name;
        b.onclick = async () => { await sfx.whenSfxRunning(); fn(); };
        list.append(b);
      }
    }
  </script>
</body>
</html>
